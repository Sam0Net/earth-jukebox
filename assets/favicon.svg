<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Atmosphere & Space Glow -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#bd93f9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8be9fd" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Deep Ocean Gradient -->
    <radialGradient id="oceanGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#2b3e66"/>
      <stop offset="55%" stop-color="#1b253d"/>
      <stop offset="100%" stop-color="#111624"/>
    </radialGradient>
    
    <!-- Vibrant Landmass Gradient -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#50fa7b"/>
      <stop offset="100%" stop-color="#32b855"/>
    </linearGradient>
    
    <!-- Spherical 3D Volume Shadow & Atmospheric Edge -->
    <radialGradient id="sphereShade" cx="28%" cy="25%" r="72%">
      <stop offset="0%" stop-color="#8be9fd" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#282a36" stop-opacity="0"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0.85"/>
    </radialGradient>

    <clipPath id="globeClip">
      <circle cx="32" cy="32" r="23"/>
    </clipPath>
  </defs>

  <!-- Outer Soundwave Orbital Ring (Earth Jukebox Theme) -->
  <ellipse cx="32" cy="32" rx="29" ry="10.5" fill="none" stroke="#8be9fd" stroke-width="1.6" stroke-dasharray="3 2" opacity="0.65" transform="rotate(-24 32 32)"/>
  <ellipse cx="32" cy="32" rx="29" ry="10.5" fill="none" stroke="#ff79c6" stroke-width="1" opacity="0.4" transform="rotate(-24 32 32)"/>

  <!-- Outer Atmospheric Halo -->
  <circle cx="32" cy="32" r="25.5" fill="url(#spaceGlow)"/>
  <circle cx="32" cy="32" r="23.6" fill="none" stroke="#8be9fd" stroke-width="1.2" opacity="0.85"/>

  <!-- Earth Globe Body -->
  <g clip-path="url(#globeClip)">
    <!-- Ocean Background -->
    <circle cx="32" cy="32" r="23" fill="url(#oceanGrad)"/>

    <!-- Continents (Detailed, recognizable Earth shapes) -->
    <!-- North America & Greenland -->
    <path d="M 23 14 C 25 12 28 12 29 14 C 28 16 25 17 25 19 C 26 21 28 20 28 22 C 25 24 22 23 20 21 C 20 17 21 15 23 14 Z" fill="url(#landGrad)"/>
    <path d="M 16 18 C 18 17 21 19 22 21 C 21 25 17 27 15 25 C 13 23 14 19 16 18 Z" fill="url(#landGrad)"/>
    <!-- Central & South America -->
    <path d="M 21 26 C 23 27 24 30 25 33 C 26 37 24 42 22 44 C 20 45 19 41 20 37 C 20 32 19 29 21 26 Z" fill="url(#landGrad)"/>
    <!-- Europe & Africa -->
    <path d="M 33 15 C 35 14 38 15 37 17 C 35 19 33 18 33 15 Z" fill="url(#landGrad)"/>
    <path d="M 32 21 C 36 20 40 22 42 26 C 43 31 40 37 37 40 C 35 42 33 39 34 35 C 34 31 32 26 32 21 Z" fill="url(#landGrad)"/>
    <!-- Asia & Oceania -->
    <path d="M 41 15 C 45 14 50 17 51 21 C 49 24 45 25 43 23 C 41 21 40 17 41 15 Z" fill="url(#landGrad)"/>
    <path d="M 46 26 C 49 27 51 30 50 32 C 47 32 46 29 46 26 Z" fill="url(#landGrad)"/>

    <!-- Real-time Sonification Latitude Pulse Line -->
    <path d="M 9 32 Q 20 29 32 32 T 55 32" fill="none" stroke="#bd93f9" stroke-width="1" opacity="0.5"/>

    <!-- 3D Shading Sphere -->
    <circle cx="32" cy="32" r="23" fill="url(#sphereShade)"/>
  </g>

  <!-- Specular Light Reflection -->
  <path d="M 13 25 A 22 22 0 0 1 31 10 A 23 23 0 0 0 13 25 Z" fill="#ffffff" opacity="0.25"/>

  <!-- Orbiting Telemetry Pin / Audio Coordinate Node -->
  <circle cx="47" cy="22" r="2.2" fill="#ff79c6" stroke="#f8f8f2" stroke-width="0.8"/>
  <circle cx="47" cy="22" r="4" fill="none" stroke="#ff79c6" stroke-width="0.6" opacity="0.6"/>
</svg>
